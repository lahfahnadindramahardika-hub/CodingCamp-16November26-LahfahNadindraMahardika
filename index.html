<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Top Header / Greeting Card -->
    <header class="card header-card">
      <button id="theme-toggle" class="btn btn-secondary theme-btn" aria-label="Toggle Theme">
        🌙 Dark Mode
      </button>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Loading date...</div>
      <h1 class="greeting">
        <span id="greeting-text">Good Morning</span>, 
        <span id="user-name" title="Click to edit name">Friend</span>
        <button id="edit-name-btn" class="icon-btn" title="Edit Name">✏️</button>
      </h1>
    </header>

    <!-- Main Grid -->
    <main class="grid-layout">
      <!-- Focus Timer Card -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn btn-secondary">Stop</button>
          <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>
      </section>

      <!-- To-Do List Card -->
      <section class="card tasks-card">
        <h2>Tasks</h2>
        <form id="task-form" class="input-group">
          <input 
            type="text" 
            id="task-input" 
            placeholder="Add a new task..." 
            required 
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="task-error" class="error-msg hidden">Task already exists!</p>
        <ul id="task-list" class="task-list"></ul>
      </section>

      <!-- Quick Links Card -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="link-form" class="input-group links-input-group">
          <input 
            type="text" 
            id="link-name" 
            placeholder="Link name" 
            required 
          />
          <input 
            type="url" 
            id="link-url" 
            placeholder="https://example.com" 
            required 
          />
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="links-container" class="links-container"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
